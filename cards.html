<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Card Stats - The Engineer Analytics</title>

    <link rel="stylesheet" href="style.css">
</head>

<body data-page="cards">

<header class="topbar">

    <div class="topbar-inner">

        <div class="brand">
            <h1>The Engineer Analytics</h1>
            <p>Slay the Spire 2 mod telemetry dashboard</p>
        </div>

        <nav class="main-nav">

            <a href="index.html" class="nav-link">
                Overview
            </a>

            <a href="cards.html" class="nav-link active">
                Cards
            </a>

            <a href="enemies.html" class="nav-link">
                Enemies
            </a>

        </nav>

        <button
                id="reloadButton"
                class="reload-button"
                type="button"
        >
            ↻ Reload
        </button>

    </div>

</header>


<div class="filter-bar">

    <div class="filter-group">

        <span class="filter-title">
            Version range
        </span>

        <label for="versionFrom">
            From
        </label>

        <select id="versionFrom"></select>

        <span class="range-arrow">
            →
        </span>

        <label for="versionTo">
            To
        </label>

        <select id="versionTo"></select>

        <div
                id="filterRunCount"
                class="filter-summary"
        >
            -
        </div>

    </div>


    <label class="toggle-control">

        <input
                type="checkbox"
                id="includeForeignMods"
        >

        <span>
            Include runs with other mods
        </span>

    </label>

</div>


<main>

    <section>

        <div class="section-heading">

            <div>
                <h2>Card Statistics</h2>

                <p>
                    Pick behaviour and final-deck performance.
                    Hover or focus a card for the full breakdown.
                </p>
            </div>

        </div>


        <div class="card-toolbar">

            <input
                    id="cardSearch"
                    type="text"
                    class="table-search"
                    placeholder="Search cards..."
            >

            <label>
                Sort by

                <select id="cardSortBy">

                    <option value="winRate">
                        Win Rate
                    </option>

                    <option value="pickRate">
                        Pick Rate
                    </option>

                    <option value="upgradeRate">
                        Upgrade Rate
                    </option>

                    <option value="offers">
                        Offers
                    </option>

                    <option value="runs">
                        Runs
                    </option>

                    <option value="name">
                        Name
                    </option>

                </select>
            </label>


            <label>
                Direction

                <select id="cardSortDirection">

                    <option value="desc">
                        Descending
                    </option>

                    <option value="asc">
                        Ascending
                    </option>

                </select>
            </label>


            <label class="toggle-control card-toggle">

                <input
                        type="checkbox"
                        id="engineerCardsOnly"
                        checked
                >

                <span>
            Engineer cards only
        </span>

            </label>

        </div>


        <div
                id="cardGrid"
                class="card-grid"
        ></div>

    </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>

</body>
</html>
