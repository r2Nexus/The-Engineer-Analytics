<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Enemy Stats - The Engineer Analytics</title>

    <link rel="stylesheet" href="style.css">
</head>

<body data-page="enemies">

<header class="topbar">

    <div class="topbar-inner">

        <div class="brand">
            <h1>The Engineer Analytics</h1>
            <p>Slay the Spire 2 mod telemetry dashboard</p>
        </div>

        <nav class="main-nav">

            <a href="index.html" class="nav-link">
                Overview
            </a>

            <a href="cards.html" class="nav-link">
                Cards
            </a>

            <a href="enemies.html" class="nav-link active">
                Enemies
            </a>

        </nav>

        <button
                id="reloadButton"
                class="reload-button"
                type="button"
        >
            ↻ Reload
        </button>

    </div>

</header>


<div class="filter-bar">

    <div class="filter-group">

        <span class="filter-title">
            Version range
        </span>

        <label for="versionFrom">
            From
        </label>

        <select id="versionFrom"></select>

        <span class="range-arrow">
            →
        </span>

        <label for="versionTo">
            To
        </label>

        <select id="versionTo"></select>

        <div
                id="filterRunCount"
                class="filter-summary"
        >
            -
        </div>

    </div>


    <label class="toggle-control">

        <input
                type="checkbox"
                id="includeForeignMods"
        >

        <span>
            Include runs with other mods
        </span>

    </label>

</div>


<main>

    <section>

        <div class="section-heading">

            <div>
                <h2>Enemy Statistics</h2>

                <p>
                    Encounter survival, damage and fight duration.
                </p>
            </div>

        </div>


        <div class="table-toolbar">

            <input
                    type="text"
                    class="table-search"
                    data-table="enemyTable"
                    placeholder="Search enemies..."
            >

        </div>


        <div class="table-wrapper">

            <table
                    id="enemyTable"
                    class="sortable"
            >

                <thead>
                <tr>
                    <th data-sort="string">
                        Enemy
                    </th>

                    <th data-sort="number">
                        Fights
                    </th>

                    <th data-sort="number">
                        Deaths
                    </th>

                    <th data-sort="number">
                        Survival Rate
                    </th>

                    <th data-sort="number">
                        Avg Turns
                    </th>

                    <th data-sort="number">
                        Avg Damage
                    </th>
                </tr>
                </thead>

                <tbody id="enemyTableBody"></tbody>

            </table>

        </div>

    </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>

</body>
</html>
